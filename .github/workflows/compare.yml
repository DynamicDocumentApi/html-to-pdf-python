# Renders the invoice with xhtml2pdf, WeasyPrint, pdfkit (wkhtmltopdf) and Playwright on Debian 12
# and uploads the PDFs, page images and results.json as an artifact. No API key needed.
name: Compare Python HTML-to-PDF libraries

on:
  workflow_dispatch:
  push:
    paths: ["invoice.html", "invoice_data.py", "invoice.json", "compare/**", ".github/workflows/compare.yml"]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Pango for WeasyPrint, fonts, wkhtmltopdf 0.12.6.1 with patched Qt)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation wget ca-certificates
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.bookworm_amd64.deb
          apt-get install -y --no-install-recommends ./wkhtmltox_0.12.6.1-3.bookworm_amd64.deb

      - name: Python packages and Chromium for Playwright
        run: |
          pip install -r compare/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render with every library
        run: python compare/run_all.py

      - uses: actions/upload-artifact@v4
        with:
          name: comparison
          path: compare/out
